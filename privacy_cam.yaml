blueprint:
  name: Privacy Cam
  description: >
    When a tracked phone enters the area (its Wi-Fi signal strength / RSSI
    drops below a threshold), the camera moves to a privacy position
    (a PTZ preset and/or a PTZ move), then returns to its normal position
    after the hold time.
    Each camera type is optional. Fill in the one that fits your camera and
    leave the other empty.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/absmry/Privacy-Cam/blob/main/privacy_cam.yaml
  input:
    detection:
      name: Phone detection
      icon: mdi:cellphone-wireless
      collapsed: false
      input:
        clients_sensor:
          name: Clients sensor
          description: The sensor that has an attribute called "clients"
          selector:
            entity:
              domain: sensor
        tracked_ips:
          name: Tracked IP addresses
          selector:
            text:
              multiple: true
        rssi_threshold:
          name: RSSI threshold
          description: The privacy mode starts when the signal is weaker than this value
          default: -75
          selector:
            number:
              min: -100
              max: -30
              mode: box
        enter_delay:
          name: Confirmation delay before starting
          description: Increase it (for example 30 seconds) to avoid false triggers caused by signal fluctuation
          default: { hours: 0, minutes: 0, seconds: 0 }
          selector:
            duration:
    preset_camera:
      name: Preset camera (optional)
      icon: mdi:cctv
      collapsed: true
      input:
        preset_select:
          name: PTZ preset select
          description: First preset = privacy position, last preset = normal position
          default: ""
          selector:
            entity:
              domain: select
    ptz_camera:
      name: PTZ button camera (optional, Reolink)
      icon: mdi:camera-control
      collapsed: true
      input:
        ptz_left:
          name: PTZ left button (privacy move)
          default: ""
          selector:
            entity:
              domain: button
        ptz_right:
          name: PTZ right button (return move)
          default: ""
          selector:
            entity:
              domain: button
        ptz_stop:
          name: PTZ stop button
          default: ""
          selector:
            entity:
              domain: button
        move_speed:
          name: Move speed
          default: 5
          selector:
            number:
              min: 1
              max: 64
              mode: box
        move_time:
          name: Move duration
          default: { hours: 0, minutes: 0, seconds: 2 }
          selector:
            duration:
    hold_time:
      name: Time to stay in privacy mode
      default: { hours: 0, minutes: 2, seconds: 0 }
      selector:
        duration:

mode: single

trigger_variables:
  sensor_entity: !input clients_sensor
  ips: !input tracked_ips
  threshold: !input rssi_threshold

variables:
  preset_entity: !input preset_select
  left_entity: !input ptz_left
  right_entity: !input ptz_right
  stop_entity: !input ptz_stop

triggers:
  - trigger: template
    value_template: >
      {% set c = state_attr(sensor_entity, 'clients') or [] %}
      {{ c | selectattr('ip', 'in', ips) | map(attribute='rssi')
         | map('int', 0) | select('lt', threshold) | list | length > 0 }}
    for: !input enter_delay

actions:
  # Enter privacy mode
  - if:
      - condition: template
        value_template: "{{ preset_entity != '' }}"
    then:
      - action: select.select_first
        target:
          entity_id: !input preset_select
  - if:
      - condition: template
        value_template: "{{ left_entity != '' and stop_entity != '' }}"
    then:
      - action: reolink.ptz_move
        target:
          entity_id: !input ptz_left
        data:
          speed: !input move_speed
      - delay: !input move_time
      - action: button.press
        target:
          entity_id: !input ptz_stop

  # Hold privacy mode
  - delay: !input hold_time

  # Return to normal position
  - if:
      - condition: template
        value_template: "{{ preset_entity != '' }}"
    then:
      - action: select.select_last
        target:
          entity_id: !input preset_select
  - if:
      - condition: template
        value_template: "{{ right_entity != '' and stop_entity != '' }}"
    then:
      - action: reolink.ptz_move
        target:
          entity_id: !input ptz_right
        data:
          speed: !input move_speed
      - delay: !input move_time
      - action: button.press
        target:
          entity_id: !input ptz_stop
